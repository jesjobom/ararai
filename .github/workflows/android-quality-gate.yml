name: Android quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARARAI_HOST_CC: /usr/bin/cc
      ARARAI_HOST_CXX: /usr/bin/c++
      ARARAI_VERSION_TIMESTAMP: ci-${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android and OpenSpec tooling
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          npm install --global @fission-ai/openspec@1.6.0

      - name: Run required quality gate
        run: scripts/quality-gate.sh

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ararai-debug-apk
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload instrumentation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ararai-instrumentation-apk
          if-no-files-found: error
          retention-days: 7
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
